<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environment Not Running</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 520px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #a0a0b0;
            margin-bottom: 1.5rem;
        }

        .command {
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #7fdbca;
            display: inline-block;
        }

        .hint {
            font-size: 0.85rem;
            color: #606080;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🧵</div>
        <h1>Environment Not Running</h1>
        <p>This project's Docker containers are currently stopped. Start the environment to access it.</p>
        <div class="command">loom start &lt;project-name&gt;</div>
        <p class="hint">Powered by Loom Spinner</p>
    </div>
</body>
</html>

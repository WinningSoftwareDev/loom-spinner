server {
    listen 80;
    server_name {{PROJECT_NAME}}.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name {{PROJECT_NAME}}.app;

    ssl_certificate     /etc/nginx/certs/{{PROJECT_NAME}}.crt;
    ssl_certificate_key /etc/nginx/certs/{{PROJECT_NAME}}.key;

    resolver 127.0.0.11 valid=10s;

    error_page 502 /502.html;

    location = /502.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        set $backend {{PROJECT_NAME}}-nginx;
        proxy_pass http://$backend:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    location /ws {
        set $ws_backend {{PROJECT_NAME}}-php;
        proxy_pass http://$ws_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}